# Optional Render Blueprint. You can also configure the same service manually
# in the Render dashboard — see docs/deployment.md. This file is not required
# for a working deploy; it just makes the first deploy reproducible.
services:
  - type: web
    name: lead-enquiry-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MODEL_PROVIDER
        value: openrouter
      - key: MODEL_NAME
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:////app/data/app.db
