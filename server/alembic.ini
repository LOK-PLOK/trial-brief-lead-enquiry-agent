[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url is intentionally omitted here; app/db/migrations/env.py reads
# it from Settings (server/app/core/config.py) so migrations and the running
# app can never point at different databases.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
